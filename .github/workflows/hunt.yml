name: Airdrop Hunter

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests feedparser
      - name: Run hunter
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/hunter_v4.py
      - name: Commit seen + data
        run: |
          git config user.name "hunter-bot"
          git config user.email "hunter-bot@github.local"
          git add -f config/seen_airdrops.json 2>/dev/null || true
          git diff --staged --quiet && echo "no changes" || (git commit -m "chore: update hunter data [skip ci]" && git push)
